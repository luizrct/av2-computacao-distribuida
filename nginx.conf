events {
    worker_connections 4096;
}

http {

    limit_req_zone $binary_remote_addr zone=img2mb_req:10m rate=500r/s;
    limit_conn_zone $binary_remote_addr zone=img2mb_conn:10m;
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=wp_cache:10m inactive=60m max_size=100m;

    upstream pool_dinamico {
        server wordpress_app;
    }

    server {

        listen 80 default_server;
        listen [::]:80 default_server;

        location = /wp-content/uploads/2026/05/imagem_2mb.jpg {

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            limit_conn img2mb_conn 800;

            limit_req zone=img2mb_req burst=500 nodelay;

            limit_req_status 429;

            limit_rate 1200k;

            add_header X-Scenario "2MB-LIMITED" always;

            proxy_pass http://pool_dinamico;
        }

        location / {

            proxy_cache wp_cache;
            proxy_cache_valid 200 10m;
            add_header X-Cache-Status $upstream_cache_status always;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_pass http://pool_dinamico;

            proxy_buffering off;
        }
    }
}
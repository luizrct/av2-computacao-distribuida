services:
  api-python:
    image: linkextractor-api:python
    build: ./api-python
    environment:
      - USE_CACHE=false
    ports:
      - "8081:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    profiles:
      - python

  api-python-cache:
    image: linkextractor-api:python-cache
    build: ./api-python
    environment:
      - USE_CACHE=true
      - REDIS_URL=redis://redis:6379
    ports:
      - "8082:5000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    profiles:
      - python-cache

  api-ruby:
    image: linkextractor-api:ruby
    build: ./api-ruby
    environment:
      - USE_CACHE=false
    ports:
      - "8083:4567"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "ruby -r net/http -e \"exit(Net::HTTP.get_response(URI('http://localhost:4567/health')).is_a?(Net::HTTPSuccess) ? 0 : 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    profiles:
      - ruby

  api-ruby-cache:
    image: linkextractor-api:ruby-cache
    build: ./api-ruby
    environment:
      - USE_CACHE=true
      - REDIS_URL=redis://redis:6379
    ports:
      - "8084:4567"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "ruby -r net/http -e \"exit(Net::HTTP.get_response(URI('http://localhost:4567/health')).is_a?(Net::HTTPSuccess) ? 0 : 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    profiles:
      - ruby-cache

  redis:
    image: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles:
      - python-cache
      - ruby-cache

  locust:
    image: locustio/locust
    working_dir: /mnt/locust
    volumes:
      - ./locust:/mnt/locust
      - ./results:/mnt/results
      - ./urls.txt:/mnt/urls.txt
    ports:
      - "8090:8089"
    profiles:
      - test